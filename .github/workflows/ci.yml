name: CI Internal

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3️⃣ Build Docker image (chỉ local, không push)
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false   # Không push lên registry
          tags: podman-test-app:latest

      # 4️⃣ Run container nội bộ để test
      - name: Run container
        run: |
          docker rm -f podman-test-app || true
          docker run -d --name podman-test-app \
            -p 5000:5000 \
            podman-test-app:latest
          
      # 5️⃣ Kiểm tra container đang chạy
      - name: Verify container
        run: docker ps
