name: CI/CD Pipeline (Build + MySQL + API Test)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ----------------------------
  # 1️⃣ Build & Push Docker Image
  # ----------------------------
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        id: buildx

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        id: docker_build
        with:
          context: .
          file: ./Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/podman-test-app:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/podman-test-app:${{ github.sha }}

  # ----------------------------
  # 2️⃣ Smoke Test Job (App + MySQL)
  # ----------------------------
  smoke_test:
    runs-on: ubuntu-latest
    needs: build_and_push

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: appdb
          MYSQL_USER: appuser
          MYSQL_PASSWORD: apppassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -p${MYSQL_ROOT_PASSWORD}" 
          --health-interval=10s 
          --health-timeout=5s 
          --health-retries=5

    env:
      MYSQL_HOST: mysql
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
      MYSQL_DATABASE: appdb
      MYSQL_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
      PORT: 5000
      IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/podman-test-app:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull Docker Image
        run: docker pull $IMAGE

      # 🕐 Wait for MySQL container to be healthy
      - name: Wait for MySQL Ready
        run: |
          echo "Waiting for MySQL to start..."
          for i in {1..60}; do
            docker exec $(docker ps -qf "ancestor=mysql:8.4") mysqladmin ping -h localhost -proot > /dev/null 2>&1 && break
            sleep 2
          done
          echo "✅ MySQL is ready."

      # 🚀 Run App container connected to MySQL service
      - name: Run App Container
        run: |
          docker run -d --rm \
            --name podman-test-app \
            --network ${{ job.services.mysql.network }} \
            -e MYSQL_HOST=$MYSQL_HOST \
            -e MYSQL_USER=$MYSQL_USER \
            -e MYSQL_PASSWORD=$MYSQL_PASSWORD \
            -e MYSQL_DATABASE=$MYSQL_DATABASE \
            -e MYSQL_PORT=$MYSQL_PORT \
            -p $PORT:$PORT \
            $IMAGE

      # 🕓 Wait until the app responds
      - name: Wait for App Startup
        run: |
          echo "Waiting for app to be ready..."
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:$PORT/ >/dev/null && exit 0
            sleep 2
          done
          echo "App did not become ready in time" >&2
          docker logs podman-test-app || true
          exit 1

      # ✅ Test endpoint: "/"
      - name: Test Root Endpoint
        run: |
          curl -fsS http://127.0.0.1:$PORT/ -o index.json
          python - <<'PY'
          import json; d=json.load(open("index.json"))
          assert d["status"] == "running", "Root endpoint not running"
          print("✅ / endpoint OK")
          PY

      # ✅ Test endpoint: "/db-ping"
      - name: Test DB Ping
        run: |
          curl -fsS http://127.0.0.1:$PORT/db-ping -o dbping.json
          python - <<'PY'
          import json; d=json.load(open("dbping.json"))
          assert "db" in d, "Missing key 'db'"
          print("✅ /db-ping:", d)
          PY

      # ✅ Test endpoint: "/faiss/search" (mock payload)
      - name: Test /faiss/search Endpoint
        run: |
          curl -fsS -X POST http://127.0.0.1:$PORT/faiss/search \
            -H "Content-Type: application/json" \
            -d '{"query": "test vector"}' -o faiss.json || true
          cat faiss.json || echo "no faiss response"

      # 🧹 Cleanup (always)
      - name: Teardown Containers
        if: always()
        run: |
          docker stop podman-test-app || true
          docker ps -a
