name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ----------------------------
  # 1️⃣ Build & Push Docker Image
  # ----------------------------
  docker:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.docker_build.outputs.imageid }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # Thiết lập Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        id: buildx

      # Build & Push image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        id: docker_build
        with:
          context: .
          file: ./Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/podman-test-app:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/podman-test-app:${{ github.sha }}

  # ----------------------------
  # 2️⃣ Smoke Test Job
  # ----------------------------
  smoke-test:
    runs-on: ubuntu-latest
    needs: docker  # chạy sau khi job docker hoàn thành

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🔹 Pull image vừa build từ Docker Hub
      - name: Pull image from Docker Hub
        run: docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/podman-test-app:latest

      # 🔹 Run container
      - name: Run container
        run: docker run -d --rm -p 5000:5000 --name podman-test-app ${{ secrets.DOCKER_HUB_USERNAME }}/podman-test-app:latest

      # 🔹 Wait for app startup (tối đa 60 giây)
      - name: Wait for app to start
        run: |
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:5000/ >/dev/null && exit 0
            sleep 1
          done
          echo "App did not start within 60 seconds" >&2
          docker logs podman-test-app || true
          exit 1

      # 🔹 Smoke test 1: Root endpoint "/"
      - name: Check root endpoint
        run: |
          curl -fsS http://127.0.0.1:5000/ -o index.json
          cat index.json
          python - <<'PY'
          import json
          d = json.load(open("index.json"))
          assert d.get("status") == "running", "App not running"
          print("✅ Root endpoint OK")
          PY

      # 🔹 Smoke test 2: DB ping endpoint
      - name: Check DB ping endpoint
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:5000/db-ping -o dbping.json || {
            echo "DB ping failed"
            docker logs podman-test-app || true
            exit 1
          }
          cat dbping.json
          python - <<'PY'
          import json
          d = json.load(open("dbping.json"))
          assert d.get("db") in ("ok","error"), "Unexpected db_ping response"
          print("✅ DB ping endpoint OK:", d)
          PY

      # 🔹 Always teardown
      - name: Stop container
        if: always()
        run: docker stop podman-test-app || true
